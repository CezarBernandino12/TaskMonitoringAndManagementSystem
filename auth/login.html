<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login — PSI</title>
	<link rel="icon" type="image/png" href="../imgs/psi.png">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="page-wrapper">

	<div class="left-panel">

		<div class="form-wrap">
			<div class="form-header">
				<div class="eyebrow">Welcome back</div>
				<h1>Sign in to<br>your account</h1>
				<p>Enter your credentials to access the system.</p>
			</div>

			<form action="php/login.php" method="POST" class="login-form">

				<div class="floating-field">
					<i class="bi bi-envelope field-icon"></i>
					<input
						type="email"
						id="email"
						name="email"
						placeholder=" "
						autocomplete="email"
						required
					>
					<label for="email">Email address</label>
				</div>

				<!-- Password — React-powered toggle -->
				<div id="password-toggle-root"></div>

				<button type="submit" class="login-btn">
					<span>Sign In</span>
					<span class="btn-arrow">
						<i class="bi bi-arrow-right"></i>
					</span>
				</button>

			</form>
		</div>

	</div>

	<div class="right-panel">

		<div class="carousel-badge">
			<div class="brand">
				<img src="../imgs/PSI.png" alt="Slide 1">
			</div>
			PSI Management System
		</div>

		<div class="carousel-track" id="carouselTrack">
			<div class="carousel-slide is-active">
				<img src="../imgs/logins.png" alt="Slide 1">
				<div class="carousel-content">
					<p class="carousel-quote">"Empowering teams<br>through smarter<br>management."</p>
				</div>
			</div>

			<div class="carousel-slide">
				<img src="../imgs/logins.png" alt="Slide 2">
				<div class="carousel-content">
					<p class="carousel-quote">"Collaboration and<br>clarity in every<br>workflow."</p>
				</div>
			</div>

			<div class="carousel-slide">
				<img src="../imgs/logins.png" alt="Slide 3">
				<div class="carousel-content">
					<p class="carousel-quote">"Your work, organised<br>beautifully and<br>efficiently."</p>
				</div>
			</div>
		</div>

		<div class="carousel-dots-global" id="carouselDots"></div>

	</div>

</div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/babel" src="js/login.jsx"></script>

</body>
</html>
