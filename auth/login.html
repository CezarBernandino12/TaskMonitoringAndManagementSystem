<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<link rel="icon" type="image/png" href="../imgs/psi.png">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="css/login.css">

</head>
<body>
	<div class="page-wrapper">
		<div class="left-panel">
			<div class="brand">
				<img src="../imgs/PSI.png" alt="PSI Logo">
			</div>

			<div class="form-wrap">
				<h1>Login</h1>
				<p class="subtitle">Welcome back. Please enter your credentials.</p>

				<form action="php/login.php" method="POST" class="login-form">
					<div class="floating-field">
						<i class="bi bi-envelope field-icon left"></i>
						<input
							type="email"
							id="email"
							name="email"
							placeholder=" "
							autocomplete="email"
							required
						>
						<label for="email">Email address</label>
					</div>

					<div class="form-group">
						<div id="password-toggle-root"></div>
					</div>

					<button type="submit" class="login-btn">
						<span>Log in</span>
						<span class="btn-arrow">
							<i class="bi bi-arrow-right"></i>
						</span>
					</button>
				</form>
			</div>
		</div>

		<div class="right-panel">
			<div class="top-card">
				<div class="yellow">
					<div class="dot"></div>
					<div class="title">Task Review With Team</div>
				</div>
				<div class="dark">09:30am-10:00am</div>
			</div>

			<div class="meeting-card">
				<div class="meeting-dot"></div>
				<div class="meeting-title">Meeting</div>
				<div class="meeting-time">12:00pm-01:00pm</div>
			</div>

			<img src="../imgs/login.jpg" alt="Login image" class="hero-image">
			<div class="right-fade"></div>
		</div>
	</div>

	<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script type="text/babel" src="js/login.jsx"></script>
</body>
</html>
