<head>
  <meta charset="UTF-8" />
  <title>Weekly Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- React + Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js — was missing entirely -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fffaf3;
      color: #333;
      font-family: Arial, sans-serif;
    }

    .card {
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #ffb84d;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      color: #222;
    }

    .sidebar-orange {
      background: #fff;
      color: #ff9900;
      border-right: 1px solid #ffe0b2;
      box-shadow: 2px 0 8px rgba(255, 153, 0, 0.04);
    }

    .sidebar-orange .nav-link {
      color: #cc7a00 !important;
      border-radius: 8px;
      margin-bottom: 2px;
      transition: 0.2s;
      font-weight: 500;
      padding: 10px 18px;
    }

    .sidebar-orange .nav-link.active,
    .sidebar-orange .nav-link:hover {
      background: linear-gradient(90deg, #ff9900 60%, #ff8800 100%);
      color: #fff !important;
    }

    .summary-card {
      background: linear-gradient(135deg, #ffe7b3 0%, #ffd27f 100%);
      border: 1px solid #ffb84d;
      color: #cc7a00;
    }
  </style>
</head>
<body>

<div id="weeklyReportRoot"></div>

<script type="text/babel">
const { useEffect, useState, useRef } = React;

function Sidebar() {
    const [showReports, setShowReports] = useState(false);

    return (
        <nav className="col-md-2 d-none d-md-block bg-white border-end min-vh-100 p-0">
            <div className="sidebar-orange d-flex flex-column p-3 gap-2 min-vh-100">
                <a href="dashboard.html" className="nav-link fw-semibold">Dashboard</a>

                <a
                    href="#"
                    className="nav-link fw-semibold d-flex justify-content-between align-items-center"
                    onClick={e => { e.preventDefault(); setShowReports(prev => !prev); }}
                    style={{ cursor: 'pointer' }}
                >
                    <span>Reports</span>
                    <span style={{ fontSize: '1.1em' }}>{showReports ? '▼' : '▶'}</span>
                </a>

                {showReports && (
                    <div style={{ marginLeft: 12 }}>
                        <a href="daily-reports.html"     className="nav-link fw-semibold">Daily</a>
                        <a href="weekly-reports.html"    className="nav-link fw-semibold">Weekly</a>
                        <a href="monthly-reports.html"   className="nav-link fw-semibold">Monthly</a>
                        <a href="quarterly-reports.html" className="nav-link fw-semibold">Quarterly</a>
                        <a href="annual-reports.html"    className="nav-link fw-semibold">Annually</a>
                    </div>
                )}

                <a href="profile.html" className="nav-link fw-semibold">Profile</a>
            </div>
        </nav>
    );
}

function getWeekStart(offsetWeeks = 0) {
    const now = new Date();
    const day = now.getDay(); // 0 = Sun, 1 = Mon ...
    const diffToMonday = (day === 0 ? -6 : 1 - day);
    const monday = new Date(now);
    monday.setDate(now.getDate() + diffToMonday + offsetWeeks * 7);
    monday.setHours(0, 0, 0, 0);
    return monday;
}

function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`; // uses local timezone, not UTC
}

function formatDisplayDate(date) {
    return date.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
}

// Labels for each day of the week starting from a Monday
function weekDayLabels(monday) {
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    return days.map((d, i) => {
        const date = new Date(monday);
        date.setDate(monday.getDate() + i);
        return `${d} ${date.getDate()}`;
    });
}

function WeeklyReportPage() {
    const [summary, setSummary]     = useState({ total: 0, completed: 0, ongoing: 0, overdue: 0 });
    const [employees, setEmployees] = useState([]);
    const [dailyTrend, setDailyTrend] = useState([]); // array of 7 objects {date, completed, ongoing, overdue}
    const [departments, setDepartments]           = useState([]);
    const [departmentFilter, setDepartmentFilter] = useState('all');
    const [weekOffset, setWeekOffset]             = useState(0);  // 0 = current week
    const [selectedEmp, setSelectedEmp]           = useState(null);

    // Chart canvas refs
    const lineRef   = useRef(null);
    const pieRef    = useRef(null);
    const radarRef  = useRef(null);

    // Chart instance refs
    const lineChart  = useRef(null);
    const pieChart   = useRef(null);
    const radarChart = useRef(null);

    const weekStart = getWeekStart(weekOffset);
    const weekEnd   = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);

    // Fetch departments once
    useEffect(() => {
        fetch('php/get_departments.php')
            .then(res => res.json())
            .then(data => setDepartments(data))
            .catch(() => setDepartments([]));
    }, []);

    // Fetch weekly report whenever week or department changes
    useEffect(() => {
        setSelectedEmp(null);
        const start = formatDate(weekStart);
        const end   = formatDate(weekEnd);
         console.log('Fetching:', { department: departmentFilter, start, end });
        fetch(`php/get_weekly_report.php?department=${departmentFilter}&week_start=${start}&week_end=${end}`)
            .then(res => res.json())
            .then(data => {
                setSummary(data.summary);
                setEmployees(data.employees);
                setDailyTrend(data.daily_trend ?? []);
            })
            .catch(err => console.error(err));
    }, [departmentFilter, weekOffset]);

    // Row click — toggle selected employee
    const handleRowClick = (emp) => {
        setSelectedEmp(prev => prev?.id === emp.id ? null : emp);
    };

    // Derived chart data depending on whether an employee is selected
    const dayLabels = weekDayLabels(weekStart);

    // Line chart: completed per day
    // When an employee is selected, use their daily_trend if available,
    // otherwise fall back to the team trend.
    const trendSource = (selectedEmp && selectedEmp.daily_trend) ? selectedEmp.daily_trend : dailyTrend;
    const lineCompleted = trendSource.map(d => d.completed ?? 0);
    const lineOngoing   = trendSource.map(d => d.ongoing   ?? 0);
    const lineOverdue   = trendSource.map(d => d.overdue   ?? 0);

    // Pie chart: overall status split
    const pieData = selectedEmp
        ? [selectedEmp.completed, selectedEmp.ongoing, selectedEmp.overdue]
        : [summary.completed, summary.ongoing, summary.overdue];

    // Radar chart: per-employee performance (all employees always shown for team context)
    const radarLabels   = employees.map(e => e.name);
    const radarCompleted = employees.map(e => e.completed);
    const radarOverdue   = employees.map(e => e.overdue);

    // ----------------------------------------------------------------
    // Build / rebuild charts
    // ----------------------------------------------------------------
    useEffect(() => {
        // --- Line chart: daily completions trend ---
        if (lineChart.current) lineChart.current.destroy();
        lineChart.current = new Chart(lineRef.current, {
            type: 'line',
            data: {
                labels: dayLabels,
                datasets: [
                    {
                        label: 'Completed',
                        data: lineCompleted,
                        borderColor: '#28a745',
                        backgroundColor: 'rgba(40,167,69,0.08)',
                        pointBackgroundColor: '#28a745',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Ongoing',
                        data: lineOngoing,
                        borderColor: '#ffc107',
                        backgroundColor: 'rgba(255,193,7,0.08)',
                        pointBackgroundColor: '#ffc107',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Overdue',
                        data: lineOverdue,
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220,53,69,0.08)',
                        pointBackgroundColor: '#dc3545',
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    title: {
                        display: !!selectedEmp,
                        text: selectedEmp ? `${selectedEmp.name} — Daily Trend` : ''
                    }
                },
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });

        // --- Pie chart: overall status distribution ---
        if (pieChart.current) pieChart.current.destroy();
        pieChart.current = new Chart(pieRef.current, {
            type: 'pie',
            data: {
                labels: ['Completed', 'Ongoing', 'Overdue'],
                datasets: [{
                    data: pieData,
                    backgroundColor: ['#28a745', '#ffc107', '#dc3545'],
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' },
                    title: {
                        display: !!selectedEmp,
                        text: selectedEmp ? `${selectedEmp.name} — Status Split` : ''
                    }
                }
            }
        });

        // --- Radar chart: employee performance overview ---
        if (radarChart.current) radarChart.current.destroy();
        if (employees.length > 0) {
            radarChart.current = new Chart(radarRef.current, {
                type: 'radar',
                data: {
                    labels: radarLabels,
                    datasets: [
                        {
                            label: 'Completed',
                            data: radarCompleted,
                            borderColor: '#28a745',
                            backgroundColor: 'rgba(40,167,69,0.15)',
                            pointBackgroundColor: '#28a745',
                            pointRadius: 4
                        },
                        {
                            label: 'Overdue',
                            data: radarOverdue,
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220,53,69,0.15)',
                            pointBackgroundColor: '#dc3545',
                            pointRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        title: {
                            display: true,
                            text: 'Team Performance Overview'
                        }
                    },
                    scales: {
                        r: {
                            beginAtZero: true,
                            ticks: { stepSize: 1 },
                            // Highlight the selected employee's spoke
                            pointLabels: {
                                font: { size: 12 },
                                color: (ctx) => {
                                    if (!selectedEmp) return '#666';
                                    return radarLabels[ctx.index] === selectedEmp.name
                                        ? '#0d6efd'
                                        : '#aaa';
                                }
                            }
                        }
                    }
                }
            });
        }

        return () => {
            if (lineChart.current)  lineChart.current.destroy();
            if (pieChart.current)   pieChart.current.destroy();
            if (radarChart.current) radarChart.current.destroy();
        };
    }, [selectedEmp, summary, employees, dailyTrend, weekOffset]);

    // ----------------------------------------------------------------
    // Completion rate helper
    // ----------------------------------------------------------------
    const completionRate = (emp) => {
        const total = emp.completed + emp.ongoing;
        return total > 0 ? Math.round((emp.completed / total) * 100) : 0;
    };

    const isCurrentWeek = weekOffset === 0;

    // ----------------------------------------------------------------
    // RENDER
    // ----------------------------------------------------------------
    return (
        <div className="container-fluid p-4">
            <div className="row">

                <Sidebar />

                <main className="col-md-10 ms-sm-auto px-4">

                    {/* Page header */}
                    <div className="d-flex justify-content-between align-items-center mb-4">
                        <h2 className="mb-0">Weekly Task Report</h2>
                        {/* Week navigation */}
                        <div className="d-flex align-items-center gap-2">
                            <button
                                className="btn btn-sm btn-outline-secondary"
                                onClick={() => setWeekOffset(prev => prev - 1)}
                            >
                                ‹ Prev
                            </button>
                            <span className="fw-semibold" style={{ minWidth: 200, textAlign: 'center' }}>
                                {formatDisplayDate(weekStart)} — {formatDisplayDate(weekEnd)}
                            </span>
                            <button
                                className="btn btn-sm btn-outline-secondary"
                                onClick={() => setWeekOffset(prev => prev + 1)}
                                disabled={isCurrentWeek}
                            >
                                Next ›
                            </button>
                            {weekOffset !== 0 && (
                                <button
                                    className="btn btn-sm btn-outline-primary"
                                    onClick={() => setWeekOffset(0)}
                                >
                                    This Week
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Info alert */}
                    <div className="alert alert-info" role="alert">
                        <strong>Overview:</strong> This report summarises all staff task activity for the
                        selected week (<strong>{formatDisplayDate(weekStart)}</strong> to{' '}
                        <strong>{formatDisplayDate(weekEnd)}</strong>).
                        <ul className="mb-0 mt-1">
                            <li><strong>Completed</strong>: Tasks marked as completed within this week.</li>
                            <li><strong>Ongoing</strong>: Tasks still in progress with a deadline on or after the week start.</li>
                            <li><strong>Overdue</strong>: Incomplete tasks whose deadline fell within or before this week.</li>
                        </ul>
                        Use the <strong>Department</strong> filter to narrow results. Use <strong>‹ Prev / Next ›</strong> to
                        navigate between weeks. Click any row in the <strong>Employee Details</strong> table to
                        focus the charts on that employee — click again to return to the full team view.
                    </div>

                    {/* Department filter */}
                    <div className="mb-4">
                        <select
                            className="form-select w-auto"
                            value={departmentFilter}
                            onChange={e => setDepartmentFilter(e.target.value)}
                        >
                            <option value="all">All Departments</option>
                            {departments.map(dep => (
                                <option key={dep.id} value={dep.id}>{dep.name}</option>
                            ))}
                        </select>
                    </div>

                    {/* Summary cards */}
                    <div className="row mb-4">
                        <div className="col-md-3">
                            <div className="card shadow-sm border-0 p-3 text-center">
                                <h6 className="text-muted mb-1">Total Tasks</h6>
                                <h2 className="mb-0">{summary.total}</h2>
                            </div>
                        </div>
                        <div className="col-md-3">
                            <div className="card shadow-sm border-0 p-3 text-center">
                                <h6 className="text-muted mb-1">Completed</h6>
                                <h2 className="text-success mb-0">{summary.completed}</h2>
                            </div>
                        </div>
                        <div className="col-md-3">
                            <div className="card shadow-sm border-0 p-3 text-center">
                                <h6 className="text-muted mb-1">Ongoing</h6>
                                <h2 className="text-warning mb-0">{summary.ongoing}</h2>
                            </div>
                        </div>
                        <div className="col-md-3">
                            <div className="card shadow-sm border-0 p-3 text-center">
                                <h6 className="text-muted mb-1">Overdue</h6>
                                <h2 className="text-danger mb-0">{summary.overdue}</h2>
                            </div>
                        </div>
                    </div>

                    {/* Row 1: Line chart (daily trend) full width */}
                    <div className="row mb-4">
                        <div className="col-12">
                            <div className="card shadow-sm border-0 p-3">
                                <div className="d-flex justify-content-between align-items-center mb-3">
                                    <h5 className="mb-0">Daily Task Trend</h5>
                                    {selectedEmp ? (
                                        <div className="d-flex align-items-center gap-2">
                                            <span className="badge bg-primary">{selectedEmp.name}</span>
                                            <button
                                                className="btn btn-sm btn-outline-secondary"
                                                onClick={() => setSelectedEmp(null)}
                                            >
                                                ✕ Clear
                                            </button>
                                        </div>
                                    ) : (
                                        <small className="text-muted">Click a row below to filter by employee</small>
                                    )}
                                </div>
                                <div style={{ height: 280 }}>
                                    <canvas ref={lineRef}></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Row 2: Pie chart + Radar chart side by side */}
                    <div className="row mb-4">
                        <div className="col-md-4">
                            <div className="card shadow-sm border-0 p-3 h-100">
                                <div className="d-flex justify-content-between align-items-center mb-3">
                                    <h5 className="mb-0">Status Distribution</h5>
                                    {selectedEmp && (
                                        <span className="badge bg-primary">{selectedEmp.name}</span>
                                    )}
                                </div>
                                <div style={{ height: 280 }}>
                                    <canvas ref={pieRef}></canvas>
                                </div>
                            </div>
                        </div>
                        <div className="col-md-8">
                            <div className="card shadow-sm border-0 p-3 h-100">
                                <div className="d-flex justify-content-between align-items-center mb-3">
                                    <h5 className="mb-0">Team Performance Radar</h5>
                                    {selectedEmp && (
                                        <small className="text-primary fw-semibold">
                                            {selectedEmp.name} highlighted
                                        </small>
                                    )}
                                </div>
                                <div style={{ height: 280 }}>
                                    <canvas ref={radarRef}></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Employee details table */}
                    <div className="card shadow-sm border-0 p-3 mt-2">
                        <div className="d-flex justify-content-between align-items-center mb-3">
                            <h5 className="mb-0">Employee Details</h5>
                            {selectedEmp && (
                                <small className="text-muted">
                                    Showing charts for <strong>{selectedEmp.name}</strong> —{' '}
                                    <span
                                        style={{ cursor: 'pointer', color: '#0d6efd' }}
                                        onClick={() => setSelectedEmp(null)}
                                    >
                                        show all
                                    </span>
                                </small>
                            )}
                        </div>
                        <div className="table-responsive">
                            <table className="table table-bordered table-hover align-middle">
                                <thead className="table-light">
                                    <tr>
                                        <th>Employee</th>
                                        <th>Department</th>
                                        <th>Completed</th>
                                        <th>Ongoing</th>
                                        <th>Overdue</th>
                                        <th>Avg. Completion/Day</th>
                                        <th>Completion Rate</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {employees.map(emp => {
                                        const rate = completionRate(emp);
                                        // Average completions per working day (Mon–Sat = 6 days)
                                        const avgPerDay = (emp.completed / 6).toFixed(1);
                                        const isSelected = selectedEmp?.id === emp.id;

                                        return (
                                            <tr
                                                key={emp.id}
                                                onClick={() => handleRowClick(emp)}
                                                style={{
                                                    cursor: 'pointer',
                                                    backgroundColor: isSelected ? '#cfe2ff' : '',
                                                    fontWeight: isSelected ? '600' : 'normal',
                                                    opacity: selectedEmp && !isSelected ? 0.5 : 1,
                                                    transition: 'opacity 0.2s, background-color 0.2s'
                                                }}
                                            >
                                                <td>
                                                    {isSelected && (
                                                        <span className="me-1" style={{ color: '#0d6efd' }}>▶</span>
                                                    )}
                                                    {emp.name}
                                                </td>
                                                <td>{emp.department}</td>
                                                <td>{emp.completed}</td>
                                                <td>{emp.ongoing}</td>
                                                <td className="text-danger fw-bold">{emp.overdue}</td>
                                                <td>{avgPerDay}</td>
                                                <td>
                                                    <div className="progress" style={{ height: 20 }}>
                                                        <div
                                                            className="progress-bar bg-success"
                                                            style={{ width: `${rate}%` }}
                                                        >
                                                            {rate}%
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                </main>
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('weeklyReportRoot'));
root.render(<WeeklyReportPage />);
</script>


</body>
</html>
