<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Monthly Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/topbar.css" />
    <link rel="stylesheet" href="css/top-shell.css" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
        .monthly-report-page .card {
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #ffb84d;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            color: #222;
        }

        .monthly-report-page .summary-card {
            background: linear-gradient(135deg, #ffe7b3 0%, #ffd27f 100%);
            border: 1px solid #ffb84d;
            color: #cc7a00;
        }
    </style>

    <script>
        (function () {
            if (localStorage.getItem("sidebar-collapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }

            const theme = localStorage.getItem("dashboard-theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-body">
    <div id="sileo-root"></div>

    <div class="app-shell">
        <header class="app-topbar">
            <div id="topbar-root"></div>
        </header>

        <div class="app-body">
            <aside class="app-sidebar-col">
                <div id="sidebar-root"></div>
            </aside>

            <main class="app-main-col">
                <div id="react-modal-root"></div>
                <div id="monthlyReportRoot"></div>
            </main>
        </div>
    </div>

    <script type="text/babel" src="js/sidebar.jsx"></script>
    <script
        type="text/babel"
        data-type="module"
        data-presets="react"
        src="js/topbar.jsx"
    ></script>
    <script type="text/babel" src="js/monthly.jsx"></script>
</body>
</html>
