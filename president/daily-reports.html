


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fffaf3;
      color: #333;
      font-family: Arial, sans-serif;
    }

    .card {
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #ffb84d;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      color: #222;
    }

    .sidebar-orange {
      background: #fff;
      color: #ff9900;
      border-right: 1px solid #ffe0b2;
      box-shadow: 2px 0 8px rgba(255, 153, 0, 0.04);
    }

    .sidebar-orange .nav-link {
      color: #cc7a00 !important;
      border-radius: 8px;
      margin-bottom: 2px;
      transition: 0.2s;
      font-weight: 500;
      padding: 10px 18px;
    }

    .sidebar-orange .nav-link.active,
    .sidebar-orange .nav-link:hover {
      background: linear-gradient(90deg, #ff9900 60%, #ff8800 100%);
      color: #fff !important;
    }

    .summary-card {
      background: linear-gradient(135deg, #ffe7b3 0%, #ffd27f 100%);
      border: 1px solid #ffb84d;
      color: #cc7a00;
    }
  </style>
</head>
<body>


<div id="dailyReportRoot"></div>
<script type="text/babel">
const { useEffect, useState, useRef } = React;

function Sidebar() {
    const [showReports, setShowReports] = useState(false);

    return (
        <nav className="col-md-2 d-none d-md-block bg-white border-end min-vh-100 p-0">
            <div className="sidebar-orange d-flex flex-column p-3 gap-2 min-vh-100">
                <a href="dashboard.html" className="nav-link fw-semibold">Dashboard</a>

                <a
                    href="#"
                    className="nav-link fw-semibold d-flex justify-content-between align-items-center"
                    onClick={e => { e.preventDefault(); setShowReports(prev => !prev); }}
                    style={{ cursor: 'pointer' }}
                >
                    <span>Reports</span>
                    <span style={{ fontSize: '1.1em' }}>{showReports ? '▼' : '▶'}</span>
                </a>

                {showReports && (
                    <div style={{ marginLeft: 12 }}>
                        <a href="daily-reports.html"     className="nav-link fw-semibold">Daily</a>
                        <a href="weekly-reports.html"    className="nav-link fw-semibold">Weekly</a>
                        <a href="monthly-reports.html"   className="nav-link fw-semibold">Monthly</a>
                        <a href="quarterly-reports.html" className="nav-link fw-semibold">Quarterly</a>
                        <a href="annual-reports.html"    className="nav-link fw-semibold">Annually</a>
                    </div>
                )}

                <a href="profile.html" className="nav-link fw-semibold">Profile</a>
            </div>
        </nav>
    );
}

function DailyReportPage() {
    const [summary, setSummary]               = useState({ total: 0, completed: 0, ongoing: 0, overdue: 0 });
    const [employees, setEmployees]           = useState([]);
    const [departmentFilter, setDepartmentFilter] = useState('all');
    const [departments, setDepartments]       = useState([]);

    // selectedEmp holds the full employee object when a row is clicked,
    // or null when showing the full team view.
    const [selectedEmp, setSelectedEmp]       = useState(null);

    const donutRef   = useRef(null);
    const barRef     = useRef(null);
    const donutChart = useRef(null);
    const barChart   = useRef(null);

    // Fetch department list once on mount
    useEffect(() => {
        fetch('php/get_departments.php')
            .then(res => res.json())
            .then(data => setDepartments(data))
            .catch(() => setDepartments([]));
    }, []);

    // Fetch report data whenever department filter changes.
    // Also reset selected employee so charts go back to full view.
    useEffect(() => {
        setSelectedEmp(null);
        fetch(`php/get_daily_report.php?department=${departmentFilter}`)
            .then(res => res.json())
            .then(data => {
                setSummary(data.summary);
                setEmployees(data.employees);
            })
            .catch(err => console.error(err));
    }, [departmentFilter]);

    // Handle row click — toggle selection on/off
    const handleRowClick = (emp) => {
        setSelectedEmp(prev => prev?.id === emp.id ? null : emp);
    };

    // Derive the chart data source:
    // - If an employee row is selected, show only that employee's numbers.
    // - Otherwise show the full team summary / all employees.
    const chartDonutData = selectedEmp
        ? [selectedEmp.completed, selectedEmp.ongoing, selectedEmp.overdue]
        : [summary.completed, summary.ongoing, summary.overdue];

    const chartBarLabels  = selectedEmp ? [selectedEmp.name]      : employees.map(e => e.name);
    const chartCompleted  = selectedEmp ? [selectedEmp.completed]  : employees.map(e => e.completed);
    const chartOngoing    = selectedEmp ? [selectedEmp.ongoing]    : employees.map(e => e.ongoing);
    const chartOverdue    = selectedEmp ? [selectedEmp.overdue]    : employees.map(e => e.overdue);

    // Rebuild both charts whenever the derived chart data changes
    useEffect(() => {
        if (donutChart.current) donutChart.current.destroy();
        donutChart.current = new Chart(donutRef.current, {
            type: 'doughnut',
            data: {
                labels: ['Completed', 'Ongoing', 'Overdue'],
                datasets: [{
                    data: chartDonutData,
                    backgroundColor: ['#28a745', '#ffc107', '#dc3545']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    // Show employee name in the chart title when filtered
                    title: {
                        display: !!selectedEmp,
                        text: selectedEmp ? `${selectedEmp.name} — Task Distribution` : ''
                    }
                }
            }
        });

        if (barChart.current) barChart.current.destroy();
        barChart.current = new Chart(barRef.current, {
            type: 'bar',
            data: {
                labels: chartBarLabels,
                datasets: [
                    { label: 'Completed', data: chartCompleted, backgroundColor: '#28a745' },
                    { label: 'Ongoing',   data: chartOngoing,   backgroundColor: '#ffc107' },
                    { label: 'Overdue',   data: chartOverdue,   backgroundColor: '#dc3545' }
                ]
            },
            options: {
                responsive: true,
                indexAxis: 'y',
                plugins: {
                    legend: { position: 'top' },
                    title: {
                        display: !!selectedEmp,
                        text: selectedEmp ? `${selectedEmp.name} — Task Breakdown` : ''
                    }
                },
                scales: {
                    x: { stacked: true, beginAtZero: true },
                    y: { stacked: true }
                }
            }
        });

        return () => {
            if (donutChart.current) donutChart.current.destroy();
            if (barChart.current)   barChart.current.destroy();
        };
    }, [selectedEmp, summary, employees]);

    return (
        <div className="container-fluid p-4">
            <div className="row">

                <Sidebar />

                <main className="col-md-10 ms-sm-auto px-4">
                    <h2 className="mb-4">Daily Task Report</h2>

                    <div className="alert alert-info" role="alert">
                        <strong>Overview:</strong> This dashboard displays a real-time snapshot of all
                        staff task activity for <strong>today</strong>.<br />
                        <ul className="mb-0 mt-1">
                            <li><strong>Completed</strong>: Tasks marked as completed today.</li>
                            <li><strong>Ongoing</strong>: Tasks still in progress whose deadline is today or later.</li>
                            <li><strong>Overdue</strong>: Incomplete tasks whose deadline has already passed.</li>
                        </ul>
                        Use the <strong>Department</strong> filter to narrow results. Click any row in
                        the <strong>Employee Details</strong> table to focus the charts on that employee.
                        Click the same row again to return to the full team view.
                    </div>

                    {/* Department filter */}
                    <div className="mb-4">
                        <select
                            className="form-select w-auto"
                            value={departmentFilter}
                            onChange={e => setDepartmentFilter(e.target.value)}
                        >
                            <option value="all">All Departments</option>
                            {departments.map(dep => (
                                <option key={dep.id} value={dep.id}>{dep.name}</option>
                            ))}
                        </select>
                    </div>

                    {/* Summary cards — always show full team totals regardless of selection */}
                    <div className="row mb-4">
                        <div className="col-md-3">
                            <div className="card shadow-sm border-0 p-3 text-center">
                                <h6>Total Tasks</h6>
                                <h2>{summary.total}</h2>
                            </div>
                        </div>
                        <div className="col-md-3">
                            <div className="card shadow-sm border-0 p-3 text-center">
                                <h6>Completed</h6>
                                <h2 className="text-success">{summary.completed}</h2>
                            </div>
                        </div>
                        <div className="col-md-3">
                            <div className="card shadow-sm border-0 p-3 text-center">
                                <h6>Ongoing</h6>
                                <h2 className="text-warning">{summary.ongoing}</h2>
                            </div>
                        </div>
                        <div className="col-md-3">
                            <div className="card shadow-sm border-0 p-3 text-center">
                                <h6>Overdue</h6>
                                <h2 className="text-danger">{summary.overdue}</h2>
                            </div>
                        </div>
                    </div>

                    {/* Charts — title and badge update when an employee is selected */}
                    <div className="row mb-4">
                        <div className="col-md-4">
                            <div className="card shadow-sm border-0 p-3 h-100">
                                <div className="d-flex justify-content-between align-items-center mb-3">
                                    <h5 className="mb-0">Task Status Distribution</h5>
                                    {selectedEmp && (
                                        <span className="badge bg-primary">{selectedEmp.name}</span>
                                    )}
                                </div>
                                <canvas ref={donutRef} height="250"></canvas>
                            </div>
                        </div>
                        <div className="col-md-8">
                            <div className="card shadow-sm border-0 p-3">
                                <div className="d-flex justify-content-between align-items-center mb-3">
                                    <h5 className="mb-0">Employee Task Performance</h5>
                                    {selectedEmp ? (
                                        <div className="d-flex align-items-center gap-2">
                                            <span className="badge bg-primary">{selectedEmp.name}</span>
                                            <button
                                                className="btn btn-sm btn-outline-secondary"
                                                onClick={() => setSelectedEmp(null)}
                                            >
                                                ✕ Clear
                                            </button>
                                        </div>
                                    ) : (
                                        <small className="text-muted">Click a row to filter</small>
                                    )}
                                </div>
                                <div style={{ height: '500px' }}>
                                    <canvas ref={barRef} height="500"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Employee details table */}
                    <div className="card shadow-sm border-0 p-3 mt-4">
                        <div className="d-flex justify-content-between align-items-center mb-3">
                            <h5 className="mb-0">Employee Details</h5>
                            {selectedEmp && (
                                <small className="text-muted">
                                    Showing charts for <strong>{selectedEmp.name}</strong> —{' '}
                                    <span
                                        style={{ cursor: 'pointer', color: '#0d6efd' }}
                                        onClick={() => setSelectedEmp(null)}
                                    >
                                        show all
                                    </span>
                                </small>
                            )}
                        </div>
                        <div className="table-responsive">
                            <table className="table table-bordered table-hover align-middle">
                                <thead className="table-light">
                                    <tr>
                                        <th>Employee</th>
                                        <th>Department</th>
                                        <th>Completed</th>
                                        <th>Ongoing</th>
                                        <th>Overdue</th>
                                        <th>Completion Rate</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {employees.map(emp => {
                                        const total = emp.completed + emp.ongoing;
                                        const rate  = total > 0
                                            ? Math.round((emp.completed / total) * 100)
                                            : 0;
                                        const isSelected = selectedEmp?.id === emp.id;

                                        return (
                                            <tr
                                                key={emp.id}
                                                onClick={() => handleRowClick(emp)}
                                                style={{
                                                    cursor: 'pointer',
                                                    // Highlight the selected row
                                                    backgroundColor: isSelected ? '#cfe2ff' : '',
                                                    fontWeight: isSelected ? '600' : 'normal',
                                                    // Dim other rows when one is selected
                                                    opacity: selectedEmp && !isSelected ? 0.5 : 1,
                                                    transition: 'opacity 0.2s, background-color 0.2s'
                                                }}
                                            >
                                                <td>
                                                    {/* Small indicator icon on the selected row */}
                                                    {isSelected && (
                                                        <span className="me-1" style={{ color: '#0d6efd' }}>▶</span>
                                                    )}
                                                    {emp.name}
                                                </td>
                                                <td>{emp.department}</td>
                                                <td>{emp.completed}</td>
                                                <td>{emp.ongoing}</td>
                                                <td className="text-danger fw-bold">{emp.overdue}</td>
                                                <td>
                                                    <div className="progress" style={{ height: '20px' }}>
                                                        <div
                                                            className="progress-bar bg-success"
                                                            style={{ width: `${rate}%` }}
                                                        >
                                                            {rate}%
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </main>

            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('dailyReportRoot'));
root.render(<DailyReportPage />);
</script>



</body>
</html>
