<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>President Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/topbar.css" />
    <link rel="stylesheet" href="css/top-shell.css" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <script>
        (function () {
            if (localStorage.getItem("sidebar-collapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }

            const theme = localStorage.getItem("dashboard-theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="sileo-root"></div>

    <div class="app-shell">
        <header class="app-topbar">
            <div id="topbar-root"></div>
        </header>

        <div class="app-body">
            <aside class="app-sidebar-col">
                <div id="sidebar-root" data-page="dashboard"></div>
            </aside>

            <main class="app-main-col">
                <div id="react-modal-root"></div>
                <div id="root"></div>

                <button
                    id="openReactModalBtn"
                    style="display:none;"
                    onclick="window.__triggerLogoutModal && window.__triggerLogoutModal()"
                ></button>
            </main>
        </div>
    </div>

    <script type="text/babel" src="js/sidebar.jsx"></script>
    <script
        type="text/babel"
        data-type="module"
        data-presets="react"
        src="js/topbar.jsx"
    ></script>
    <script
        type="text/babel"
        src="js/dashboard.jsx"
    ></script>
</body>
</html>
