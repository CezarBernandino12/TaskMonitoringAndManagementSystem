<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>President Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Use jsdelivr consistently (same as all other report pages) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js loaded in <head> so it is always available when React renders -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fffaf3;
      color: #333;
      font-family: Arial, sans-serif;
    }
    .card {
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #ffb84d;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      color: #222;
    }
    .sidebar-orange {
      background: #fff;
      color: #ff9900;
      border-right: 1px solid #ffe0b2;
      box-shadow: 2px 0 8px rgba(255, 153, 0, 0.04);
    }
    .sidebar-orange .nav-link {
      color: #cc7a00 !important;
      border-radius: 8px;
      margin-bottom: 2px;
      transition: 0.2s;
      font-weight: 500;
      padding: 10px 18px;
    }
    .sidebar-orange .nav-link.active,
    .sidebar-orange .nav-link:hover {
      background: linear-gradient(90deg, #ff9900 60%, #ff8800 100%);
      color: #fff !important;
    }
    .summary-card {
      background: linear-gradient(135deg, #ffe7b3 0%, #ffd27f 100%);
      border: 1px solid #ffb84d;
      color: #cc7a00;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ====================================================================
// SIDEBAR — extracted as a proper component so useState is called at
// the top level. Fixes the Rules of Hooks violation in the original.
// ====================================================================
function Sidebar() {
    const [showReports, setShowReports] = useState(false);
    return (
        <nav className="col-md-2 d-none d-md-block bg-white border-end min-vh-100 p-0">
            <div className="sidebar-orange d-flex flex-column p-3 gap-2 min-vh-100">
                <a href="dashboard.html" className="nav-link fw-semibold">Dashboard</a>
                <a
                    href="#"
                    className="nav-link fw-semibold d-flex justify-content-between align-items-center"
                    onClick={e => { e.preventDefault(); setShowReports(p => !p); }}
                    style={{ cursor: 'pointer' }}
                >
                    <span>Reports</span>
                    <span style={{ fontSize: '1.1em' }}>{showReports ? '▼' : '▶'}</span>
                </a>
                {showReports && (
                    <div style={{ marginLeft: 12 }}>
                        <a href="daily-reports.html"     className="nav-link fw-semibold">Daily</a>
                        <a href="weekly-reports.html"    className="nav-link fw-semibold">Weekly</a>
                        <a href="monthly-reports.html"   className="nav-link fw-semibold">Monthly</a>
                        <a href="quarterly-reports.html" className="nav-link fw-semibold">Quarterly</a>
                        <a href="annual-reports.html"    className="nav-link fw-semibold">Annually</a>
                    </div>
                )}
                <a href="profile.html" className="nav-link fw-semibold">Profile</a>
            </div>
        </nav>
    );
}

// ====================================================================
// FILTER OPTIONS
// ====================================================================
const FILTERS = [
    { label: 'Today',        value: 'daily'     },
    { label: 'This Week',    value: 'weekly'    },
    { label: 'This Month',   value: 'monthly'   },
    { label: 'This Quarter', value: 'quarterly' },
    { label: 'This Year',    value: 'annually'  },
];

// ====================================================================
// DASHBOARD
// ====================================================================
function Dashboard() {
    const [filter, setFilter]           = useState('monthly');
    const [showFilter, setShowFilter]   = useState(false);
    const [stats, setStats]             = useState({
        total_departments: '—',
        total_tasks:       '—',
        completed_tasks:   '—',
        ongoing_tasks:     '—',
        overdue_tasks:     '—',
        completion_rate:   '—',
    });
    const [departments, setDepartments] = useState([]);
    const [dateLabel, setDateLabel]     = useState('');

    const chartRef      = useRef(null);
    const chartInstance = useRef(null);

    // ----------------------------------------------------------------
    // Fetch stats + departments whenever filter changes
    // ----------------------------------------------------------------
    useEffect(() => {
        const enc = encodeURIComponent(filter);

        fetch('php/get_dashboard_stats.php?filter=' + enc)
            .then(r => r.json())
            .then(data => {
                if (data.error) { console.error('Stats error:', data.error); return; }
                setStats(data);
            })
            .catch(err => console.error(err));

        fetch('php/get_department_performance_filtered.php?filter=' + enc)
            .then(r => r.json())
            .then(data => {
                if (data.error) { console.error('Dept error:', data.error); return; }
                setDepartments(Array.isArray(data.departments) ? data.departments : []);
                setDateLabel(data.date_label || '');
            })
            .catch(err => console.error(err));
    }, [filter]);

    // ----------------------------------------------------------------
    // Build / rebuild the bar chart whenever departments data changes
    // ----------------------------------------------------------------
    useEffect(() => {
        if (!chartRef.current || departments.length === 0) return;

        if (chartInstance.current) chartInstance.current.destroy();

        chartInstance.current = new Chart(chartRef.current, {
            type: 'bar',
            data: {
                labels: departments.map(d => d.department),
                datasets: [
                    {
                        label: 'Total Tasks',
                        data: departments.map(d => d.total_tasks),
                        backgroundColor: '#ffd27f',
                        borderColor: '#ffb84d',
                        borderWidth: 1,
                        borderRadius: 4,
                    },
                    {
                        label: 'Completed',
                        data: departments.map(d => d.completed),
                        backgroundColor: '#b6e388',
                        borderColor: '#7ed957',
                        borderWidth: 1,
                        borderRadius: 4,
                    },
                    {
                        label: 'Ongoing',
                        data: departments.map(d => d.ongoing),
                        backgroundColor: '#ffe066',
                        borderColor: '#ffd700',
                        borderWidth: 1,
                        borderRadius: 4,
                    },
                    {
                        label: 'Overdue',
                        data: departments.map(d => d.overdue),
                        backgroundColor: '#ffb3b3',
                        borderColor: '#ff4d4d',
                        borderWidth: 1,
                        borderRadius: 4,
                    },
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            afterBody: (items) => {
                                const dept = departments[items[0]?.dataIndex];
                                return dept ? `Completion rate: ${dept.completion_percent}%` : '';
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { display: false } },
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });

        return () => {
            if (chartInstance.current) chartInstance.current.destroy();
        };
    }, [departments]);

    // ----------------------------------------------------------------
    // Close filter dropdown on outside click
    // ----------------------------------------------------------------
    useEffect(() => {
        if (!showFilter) return;
        const handler = (e) => {
            if (!e.target.closest('.filter-dropdown')) setShowFilter(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
    }, [showFilter]);

    // ----------------------------------------------------------------
    // Department/s with the most overdue tasks
    // ----------------------------------------------------------------
    const overdueList = departments.filter(d => d.overdue > 0);
    let topOverdue = [];
    if (overdueList.length > 0) {
        const maxOverdue = Math.max(...overdueList.map(d => d.overdue));
        topOverdue = overdueList.filter(d => d.overdue === maxOverdue);
    }

    const activeFilterLabel = FILTERS.find(f => f.value === filter)?.label || 'Filter';

    // ----------------------------------------------------------------
    // RENDER
    // ----------------------------------------------------------------
    return (
        <div className="container-fluid py-4">
            <div className="row">

                <Sidebar />

                <main className="col-md-10 ms-sm-auto px-4">

                    {/* Header */}
                    <div className="mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
                        <div>
                            <h3 className="mb-0">President Dashboard</h3>
                            <p className="text-muted mb-0">Department Performance Overview · {dateLabel}</p>
                        </div>

                        {/* Period filter */}
                        <div className="position-relative filter-dropdown">
                            <button
                                className="btn btn-outline-warning fw-semibold px-4 py-2 rounded-pill shadow-sm"
                                style={{ minWidth: 160 }}
                                onClick={() => setShowFilter(v => !v)}
                                aria-haspopup="listbox"
                                aria-expanded={showFilter}
                            >
                                <span className="me-2">{activeFilterLabel}</span>
                                <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
                                    <path d="M7 10l5 5 5-5" stroke="#ff9900" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                                </svg>
                            </button>
                            {showFilter && (
                                <ul
                                    className="dropdown-menu show mt-2 shadow rounded-3 border-0 w-100"
                                    style={{ minWidth: 160, zIndex: 1000 }}
                                    role="listbox"
                                >
                                    {FILTERS.map(opt => (
                                        <li key={opt.value}>
                                            <button
                                                className={`dropdown-item py-2${filter === opt.value ? ' fw-bold' : ''}`}
                                                style={{
                                                    borderRadius: 8,
                                                    backgroundColor: filter === opt.value ? 'rgba(255,165,0,0.15)' : 'transparent',
                                                    color: filter === opt.value ? '#cc8400' : 'inherit',
                                                }}
                                                onClick={() => { setFilter(opt.value); setShowFilter(false); }}
                                                role="option"
                                                aria-selected={filter === opt.value}
                                            >
                                                {opt.label}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>

                    {/* Summary cards — now shows 5 cards including ongoing and overdue */}
                    <div className="row mb-4">
                        <div className="col-md-2">
                            <div className="card summary-card text-center p-3">
                                <h6>Departments</h6>
                                <h3>{stats.total_departments}</h3>
                            </div>
                        </div>
                        <div className="col-md-2">
                            <div className="card summary-card text-center p-3">
                                <h6>Total Tasks</h6>
                                <h3>{stats.total_tasks}</h3>
                            </div>
                        </div>
                        <div className="col-md-2">
                            <div className="card summary-card text-center p-3">
                                <h6>Completed</h6>
                                <h3 className="text-success">{stats.completed_tasks}</h3>
                            </div>
                        </div>
                        <div className="col-md-2">
                            <div className="card summary-card text-center p-3">
                                <h6>Ongoing</h6>
                                <h3 className="text-warning">{stats.ongoing_tasks}</h3>
                            </div>
                        </div>
                        <div className="col-md-2">
                            <div className="card summary-card text-center p-3">
                                <h6>Overdue</h6>
                                <h3 className="text-danger">{stats.overdue_tasks}</h3>
                            </div>
                        </div>
                        <div className="col-md-2">
                            <div className="card summary-card text-center p-3">
                                <h6>Completion Rate</h6>
                                <h3>{stats.completion_rate}</h3>
                            </div>
                        </div>
                    </div>

                    {/* Department performance bar chart */}
                    <div className="card p-3 mb-4">
                        <div className="d-flex justify-content-between align-items-center mb-3">
                            <h5 className="mb-0">Department Performance</h5>
                            <span className="text-muted small">{dateLabel}</span>
                        </div>
                        {departments.length === 0 ? (
                            <p className="text-muted text-center py-4">No data available for this period.</p>
                        ) : (
                            <div style={{ height: 320 }}>
                                <canvas ref={chartRef}></canvas>
                            </div>
                        )}
                    </div>

                    {/* Departments with most overdue tasks */}
                    <div className="card p-3 mb-4">
                        <h5 className="mb-2">Department{topOverdue.length !== 1 ? 's' : ''} with Most Overdue Tasks</h5>
                        {topOverdue.length === 0 ? (
                            <p className="text-muted mb-0">No overdue tasks in this period.</p>
                        ) : (
                            <ul className="mb-0">
                                {topOverdue.map((dept, idx) => (
                                    <li key={dept.department + idx}>
                                        <strong>{dept.department}</strong> — {dept.overdue} overdue task{dept.overdue !== 1 ? 's' : ''}
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>

                    {/* Department performance table */}
                    <div className="card p-3">
                        <h5 className="mb-3">
                            Department Performance Table
                            <span className="text-muted small ms-2">{dateLabel}</span>
                        </h5>
                        <div className="table-responsive">
                            <table className="table table-bordered table-hover align-middle">
                                <thead className="table-light">
                                    <tr>
                                        <th>Department</th>
                                        <th>Total Tasks</th>
                                        <th>Completed</th>
                                        <th>Ongoing</th>
                                        <th>Overdue</th>
                                        <th>Completion Rate</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {departments.length === 0 ? (
                                        <tr>
                                            <td colSpan="6" className="text-center text-muted">No data available for this period.</td>
                                        </tr>
                                    ) : (
                                        departments.map((dept, idx) => {
                                            const rate = dept.completion_percent;
                                            return (
                                                <tr key={dept.department + idx}>
                                                    <td style={{ fontWeight: 500 }}>{dept.department}</td>
                                                    <td>{dept.total_tasks}</td>
                                                    <td>{dept.completed}</td>
                                                    <td>{dept.ongoing}</td>
                                                    <td className="text-danger fw-bold">{dept.overdue}</td>
                                                    <td>
                                                        {dept.total_tasks === 0 ? (
                                                            <span className="text-muted" style={{ fontSize: '0.9em' }}>No tasks yet</span>
                                                        ) : rate === 0 ? (
                                                            <span className="text-danger" style={{ fontSize: '0.9em', fontWeight: 500 }}>0% — None completed</span>
                                                        ) : (
                                                            <div className="d-flex align-items-center gap-2">
                                                                <span style={{ minWidth: 36 }}>{rate}%</span>
                                                                <div className="progress flex-grow-1" style={{ height: 18 }}>
                                                                    <div
                                                                        className="progress-bar bg-success"
                                                                        role="progressbar"
                                                                        style={{ width: `${rate}%` }}
                                                                        aria-valuenow={rate}
                                                                        aria-valuemin="0"
                                                                        aria-valuemax="100"
                                                                    />
                                                                </div>
                                                            </div>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                </main>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>

</body>
</html>
