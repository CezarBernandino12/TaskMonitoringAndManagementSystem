<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gantt Chart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/gantt-chart.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        (function () {
            const isCollapsed = localStorage.getItem("sidebar-collapsed") === "true";
            if (isCollapsed) {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }
        })();
    </script>
</head>
<body>


<div class="container-fluid py-4">
    <div class="row g-4 align-items-start">
        <aside class="col-12 col-md-4 col-lg-3 col-xl-2">
            <div id="sidebar-root"></div>
        </aside>


<main class="col-md-10 ms-sm-auto px-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Gantt Chart</h3>
    </div>

  <div id="react-modal-root"></div>
  <div id="gantt-chart-root"></div>
    </div>

</main>
  </div>


<script type="text/babel" src="js/sidebar.jsx"></script>
  <script type="text/babel">
/* ---------------- Gantt Chart Page ---------------- */
function GanttChartPage() {
    return (
        <div className="card p-3" style={{ borderColor: '#ffb366' }}>
            
            <div style={{ height: '300px', background: '#fff3e0', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '8px' }}>
                <span style={{ color: '#ff7f2a' }}>Gantt Chart here</span>
            </div>
        </div>
    );
}

/* ---------------- Render the Gantt Chart Page ---------------- */
ReactDOM.createRoot(document.getElementById('gantt-chart-root')).render(<GanttChartPage />);
</script>

</body>
</html>
