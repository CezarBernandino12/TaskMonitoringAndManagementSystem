<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strategic Plan Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/top-shell.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/docx@8.2.4/build/index.umd.js"></script>

<!-- docx library — primary: unpkg, fallback: jsdelivr -->
<script>
    window.__docxLoaded = false;
    function __onDocxLoad() { window.__docxLoaded = true; }
</script>
<script src="https://unpkg.com/docx@9.5.3/build/index.min.js" onload="__onDocxLoad()" onerror="
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/docx@9.5.3/build/index.min.js';
    s.onload = function() { window.__docxLoaded = true; };
    document.head.appendChild(s);
"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        (function () {
            const root = document.documentElement;

            const isCollapsed = localStorage.getItem("sidebar-collapsed") === "true";
            if (isCollapsed) {
                root.classList.add("sidebar-collapsed-init");
            }

            const theme = localStorage.getItem("dashboard-theme") || "light";
            root.setAttribute("data-theme", theme);
            root.setAttribute("data-bs-theme", theme);
        })();
    </script>
</head>
<body class="bg-body">
    <div id="sileo-root"></div>

    <div class="app-shell">
        <header class="app-topbar">
            <div id="topbar-root"></div>
        </header>

        <div class="app-body">
            <aside class="app-sidebar-col">
                <div id="sidebar-root"></div>
            </aside>

            <main class="app-main-col">
                <div id="react-modal-root"></div>
                <div id="root"></div>
                
            </main>
        </div>
    </div>


    <script type="text/babel" src="js/sidebar.jsx"></script>

    <script
        type="text/babel"
        data-type="module"
        data-presets="react"
        src="js/topbar.jsx"
    ></script>

    <script type="text/babel" src="js/strategic_plan_preview.jsx"></script>
</body>
</html>
