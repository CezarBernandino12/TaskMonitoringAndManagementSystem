<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Staff</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/manage-staff.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/top-shell.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <!-- Keep these because sidebar.jsx still uses global React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        #manage-staffs-root {
            width: 100%;
            min-height: 240px;
        }
    </style>

    <script>
        (function () {
            const docRoot = document.documentElement;

            const isCollapsed = localStorage.getItem("sidebar-collapsed") === "true";
            if (isCollapsed) {
                docRoot.classList.add("sidebar-collapsed-init");
            }

            const theme = localStorage.getItem("dashboard-theme") || "light";
            docRoot.setAttribute("data-theme", theme);
            docRoot.setAttribute("data-bs-theme", theme);
        })();
    </script>
</head>
<body class="bg-body">
    <div id="sileo-root"></div>

    <div class="app-shell">
        <header class="app-topbar">
            <div id="topbar-root"></div>
        </header>

        <div class="app-body">
            <aside class="app-sidebar-col">
                <div id="sidebar-root"></div>
            </aside>

            <main class="app-main-col">
                <div id="react-modal-root"></div>
                <div id="manage-staffs-root"></div>
            </main>
        </div>
    </div>

    <script
        type="text/babel"
        data-presets="react"
        src="js/sidebar.jsx"
    ></script>

    <script
        type="text/babel"
        data-type="module"
        data-presets="react"
        src="js/topbar.jsx"
    ></script>

    <script
        type="text/babel"
        data-type="module"
        data-presets="react"
        src="js/manage-staff.jsx"
    ></script>
</body>
</html>
