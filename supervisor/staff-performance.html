<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Performance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/staff-performance.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        (function () {
            const isCollapsed = localStorage.getItem("sidebar-collapsed") === "true";
            if (isCollapsed) {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }
        })();
    </script>

</head>
<body>


<div class="container-fluid py-4">
    <div class="row g-4 align-items-start">
        <aside class="col-12 col-md-4 col-lg-3 col-xl-2">
            <div id="sidebar-root"></div>
        </aside>

        <main class="col-md-10 ms-sm-auto px-4">


    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Staff Performance</h3>
    </div>


  <div id="staff-performance-root"></div>

 


</div>

    </main>
  </div>


<script type="text/babel" src="js/sidebar.jsx"></script>
  <script type="text/babel">
/* ---------------- Staff Performance ---------------- */
function StaffPerformance() {
    const [staffs, setStaffs] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    React.useEffect(() => {
        fetch('php/get_staff_performance.php')
            .then(res => res.json())
            .then(data => {
                setStaffs(data);
                setLoading(false);
            })
            .catch(() => setLoading(false));
    }, []);

    return (
        <div className="card p-3" style={{ borderColor: '#ffb366' }}>
            <h5>Manage Staffs</h5>
            <div style={{ minHeight: '300px', background: '#fff3e0', borderRadius: '8px', padding: '20px' }}>
                {loading ? (
                    <div className="text-center text-warning">Loading staff list...</div>
                ) : staffs.length === 0 ? (
                    <div className="text-center text-danger">No staff found.</div>
                ) : (
                    <div className="table-responsive">
                        <table className="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Total Tasks</th>
                                    <th>Completed</th>
                                    <th>Ongoing</th>
                                    <th>Overdue</th>
                                </tr>
                            </thead>
                            <tbody>
                                {staffs.map((s, idx) => (
                                    <tr key={idx} className={s.overdue > 0 ? 'overdue' : ''}>
                                        <td>{s.name}</td>
                                        <td>{s.total}</td>
                                        <td>{s.completed}</td>
                                        <td>{s.ongoing}</td>
                                        <td>{s.overdue}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                )}
            </div>
        </div>
    );
}

/* ---------------- Render the Staff Performance ---------------- */
ReactDOM.createRoot(document.getElementById('staff-performance-root')).render(<StaffPerformance />);
</script>

</body>
</html>
