<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/app-shell.css">
    <link rel="stylesheet" href="css/calendar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        (function () {
            if (localStorage.getItem("sidebar-collapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }

            const theme = localStorage.getItem("dashboard-theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>
    <div class="app-shell">
        <header class="app-topbar">
            <div id="topbar-root"></div>
        </header>

        <div class="app-body">
            <aside class="app-sidebar-col">
                <div id="sidebar-root"></div>
            </aside>

            <main class="app-main-col">
                <div id="react-modal-root"></div>
                <div id="root"></div>

                <div class="card p-3 mt-3">
                    <h5>📅 Calendar</h5>
                    <div id="calendar" style="height: 300px; background: #e9ecef; display:flex; align-items:center; justify-content:center;">
                        <span>Calendar will appear here</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="text/babel" src="js/sidebar.jsx"></script>
    <script type="text/babel" src="js/topbar.jsx"></script>
    <script type="text/babel" src="js/calendar.jsx"></script>
</body>
</html>
