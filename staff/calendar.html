<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/calendar.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        (function () {
            const isCollapsed = localStorage.getItem("sidebar-collapsed") === "true";
            if (isCollapsed) {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }
        })();
    </script>
</head>
<body>


<div class="container-fluid py-4">
<div class="row g-4 align-items-start">
<aside class="col-12 col-md-4 col-lg-3 col-xl-2">
    <nav class="dashboard-sidebar" id="dashboardSidebar">
        <button class="sidebar-toggle" id="sidebarToggle" type="button">
            <i class="bi bi-chevron-left"></i>
        </button>

        <div class="sidebar-inner">
            <div class="sidebar-profile">
                <img
                    src="https://ui-avatars.com/api/?name=Andrew+Smith&background=f7c4d4&color=222&size=80"
                    alt="Profile"
                    class="sidebar-avatar"
                >
                <div class="sidebar-profile-info">
                    <div class="sidebar-role">Staff</div>
                    <div class="sidebar-name">Andrew Smith</div>
                </div>
            </div>

            <div class="sidebar-divider"></div>
            <div class="sidebar-section-label">MAIN</div>

            <a href="dashboard.html" class="sidebar-link">
                <span class="sidebar-icon"><i class="bi bi-house-door"></i></span>
                <span class="sidebar-text">Dashboard</span>
            </a>

            <a href="my-tasks.html" class="sidebar-link">
                <span class="sidebar-icon"><i class="bi bi-list-check"></i></span>
                <span class="sidebar-text">My Tasks</span>
            </a>

            <a href="calendar.html" class="sidebar-link active">
                <span class="sidebar-icon"><i class="bi bi-calendar3"></i></span>
                <span class="sidebar-text">Calendar</span>
            </a>

            <div class="sidebar-divider mt-3"></div>
            <div class="sidebar-section-label">SETTINGS</div>

            <a href="profile.html" class="sidebar-link">
                <span class="sidebar-icon"><i class="bi bi-gear"></i></span>
                <span class="sidebar-text">Account Settings</span>
            </a>

            <div class="sidebar-bottom">
                <a href="#" class="sidebar-link logout-link">
                    <span class="sidebar-icon"><i class="bi bi-box-arrow-right"></i></span>
                    <span class="sidebar-text">Logout Account</span>
                </a>
            </div>
    </nav>
</aside>
        <main class="col-md-10 ms-sm-auto px-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Calendar</h3>
    </div>

    <div id="react-modal-root"></div>

    <div id="root"></div>
        <div id="react-modal-root"></div>
    <button id="openReactModalBtn" style="display:none;"></button>


    <div class="card p-3">
        <h5>📅 Calendar</h5>
        <div id="calendar" style="height: 300px; background: #e9ecef; display:flex; align-items:center; justify-content:center;">
            <span>Calendar will appear here</span>
        </div>
    </div>


</div>
<script type="text/babel" src="js/calendar.jsx"> </script>
<script type="text/babel" src="js/sidebar.jsx"> </script>
<script>
    const sidebar = document.getElementById("dashboardSidebar");
    const sidebarToggle = document.getElementById("sidebarToggle");

    sidebarToggle.addEventListener("click", function () {
        sidebar.classList.toggle("collapsed");
    });
</script>
</body>
</html>
