<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/calendar.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
    (function () {
        const isCollapsed = localStorage.getItem("sidebar-collapsed") === "true";
        if (isCollapsed) {
            document.documentElement.classList.add("sidebar-collapsed-init");
        }
    })();
    </script>
</head>
<body>


<div class="container-fluid py-4">
<div class="row g-4 align-items-start">
    <aside class="col-12 col-md-4 col-lg-3 col-xl-2">
        <div id="sidebar-root" data-page="calendar"></div>
    </aside>

    <main class="col-md-10 ms-sm-auto px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Calendar</h3>
        </div>

        <div id="react-modal-root"></div>

        <div id="root"></div>
            <div id="react-modal-root"></div>
        <button id="openReactModalBtn" style="display:none;"></button>


        <div class="card p-3">
            <h5>📅 Calendar</h5>
            <div id="calendar" style="height: 300px; background: #e9ecef; display:flex; align-items:center; justify-content:center;">
                <span>Calendar will appear here</span>
            </div>
        </div>
    </main>
</div>
<script type="text/babel" src="js/calendar.jsx"></script>
<script type="text/babel" src="js/sidebar.jsx"></script>
</body>
</html>
