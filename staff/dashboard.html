<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">   <!-- ← new -->
    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Apply saved collapse state AND saved theme before first paint -->
    <script>
        (function () {
            /* sidebar collapsed flash prevention */
            if (localStorage.getItem("sidebar-collapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }

            /* dark mode flash prevention */
            const theme = localStorage.getItem("dashboard-theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>

<div class="container-fluid py-4">
    <div class="row g-4 align-items-start">

        <!-- ── Sidebar ── -->
        <aside class="col-12 col-md-4 col-lg-3 col-xl-2 staff-sidebar-col">
            <div id="sidebar-root" data-page="dashboard"></div>
        </aside>

        <!-- ── Main content ── -->
        <main class="col-12 col-md-8 col-lg-9 col-xl-10 px-md-4">
            <div id="dashboard-header-root"></div>
            <div id="react-modal-root"></div>


            <div id="root"></div>
            <button
                id="openReactModalBtn"
                style="display:none;"
                onclick="window.__triggerLogoutModal && window.__triggerLogoutModal()"
            ></button>

        </main>
    </div>
</div>

<script type="text/babel" src="js/sidebar.jsx"></script>
<script type="text/babel" src="js/topbar.jsx"></script>    
<script type="text/babel" src="js/dashboard.jsx"></script>

</body>
</html>
