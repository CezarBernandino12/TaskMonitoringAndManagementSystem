<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        (function () {
            if (localStorage.getItem("sidebar-collapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }
            const theme = localStorage.getItem("dashboard-theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <style>
        /* ── Layout shell ───────────────────────────────────────── */
        html, body {
            height: 100%;
            margin: 0;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Topbar: full-width sticky row ──────────────────────── */
        .app-topbar {
            position: sticky;
            top: 0;
            z-index: 200;
            width: 100%;
            /* Blend with sidebar's white card feel */
            background: var(--topbar-bg, #1c1008);
            border-bottom: 1px solid var(--topbar-border, rgba(255,255,255,0.08));
        }

        /* ── Body row: sidebar + content side by side ───────────── */
        .app-body {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 0;
        }

        /* ── Sidebar column ─────────────────────────────────────── */
        .app-sidebar-col {
            /* Sticky within the scrollable body row */
            position: sticky;
            top: 0;                    /* sticks below the topbar */
            align-self: flex-start;
            height: calc(100vh - var(--topbar-height, 64px));
            padding: 16px 0 16px 16px;
            flex-shrink: 0;
        }

        /* ── Main content column ────────────────────────────────── */
        .app-main-col {
            flex: 1;
            min-width: 0;
            padding: 24px 28px;
            overflow-y: auto;
        }

        /* ── Topbar profile: email-only, no dropdown ────────────── */
        /*
         * Add these overrides to topbar.css (or keep here).
         * They hide the name row and the chevron/dropdown toggle.
         */
        .topbar-profile-name,
        .topbar-profile-chevron,
        .topbar-dropdown-toggle i.bi-chevron-down,
        [class*="topbar"][class*="caret"],
        [class*="topbar"][class*="arrow"] {
            display: none !important;
        }

        /* Tighten the profile pill now that name is gone */
        .topbar-profile,
        .topbar-user-info,
        [class*="topbar-user"],
        [class*="topbar-profile"] {
            cursor: default !important;
            pointer-events: none;       /* disable any dropdown trigger */
        }

        /* ── Mobile: stack topbar → sidebar drawer → content ────── */
        @media (max-width: 767.98px) {
            .app-body {
                flex-direction: column;
            }

            .app-sidebar-col {
                position: static;
                height: auto;
                padding: 0;
            }

            .app-main-col {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
<div class="app-shell">

    <!-- ── Full-width topbar ── -->
    <header class="app-topbar">
        <div id="topbar-root"></div>
    </header>

    <!-- ── Sidebar + content row ── -->
    <div class="app-body">

        <aside class="app-sidebar-col">
            <div id="sidebar-root" data-page="dashboard"></div>
        </aside>

        <main class="app-main-col">
            <div id="dashboard-header-root"></div>
            <div id="react-modal-root"></div>
            <div id="root"></div>

            <!-- Hidden trigger kept for ModalController compatibility -->
            <button
                id="openReactModalBtn"
                style="display:none;"
                onclick="window.__triggerLogoutModal && window.__triggerLogoutModal()"
            ></button>
        </main>

    </div><!-- /.app-body -->

</div><!-- /.app-shell -->

<script type="text/babel" src="js/sidebar.jsx"></script>
<script type="text/babel" src="js/topbar.jsx"></script>
<script type="text/babel" src="js/dashboard.jsx"></script>
</body>
</html>
