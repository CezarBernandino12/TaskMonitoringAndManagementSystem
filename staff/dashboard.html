<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        (function () {
            if (localStorage.getItem("sidebar-collapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }
            const theme = localStorage.getItem("dashboard-theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

<style>
    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        overflow-x: hidden;
    }

    .app-shell {
        min-height: 100vh;
        background: var(--bg-page, #f4f4f6);
    }

    .app-topbar {
        position: sticky;
        top: 0;
        left: 0;
        z-index: 100;
        width: 100%;
    }

    .app-body {
        position: relative;
        min-height: calc(100vh - var(--topbar-height, 70px));
    }

    /* sidebar floats over the topbar */
    .app-sidebar-col {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 300;
        padding: 0;
        flex-shrink: 0;
    }

    /* main content leaves room for the floating sidebar */
    .app-main-col {
        min-width: 0;
        padding: calc(var(--topbar-height, 70px) + 24px) 28px 24px 332px;
    }

    /* nicer spacing when sidebar is collapsed */
    body:has(.dashboard-sidebar.collapsed) .app-main-col {
        padding-left: 172px;
    }

    .topbar-profile-name,
    .topbar-profile-chevron,
    .topbar-dropdown-toggle i.bi-chevron-down,
    [class*="topbar"][class*="caret"],
    [class*="topbar"][class*="arrow"] {
        display: none !important;
    }

    @media (max-width: 767.98px) {
        .app-sidebar-col {
            position: static;
            top: auto;
            left: auto;
            z-index: auto;
        }

        .app-main-col {
            padding: calc(var(--topbar-height, 70px) + 16px) 16px 16px;
        }
    }
</style>
</head>

<body>
<div class="app-shell">

    <header class="app-topbar">
        <div id="topbar-root"></div>
    </header>

    <div class="app-body">
        <aside class="app-sidebar-col">
            <div id="sidebar-root" data-page="dashboard"></div>
        </aside>

        <main class="app-main-col">
            <div id="react-modal-root"></div>
            <div id="root"></div>

            <button
                id="openReactModalBtn"
                style="display:none;"
                onclick="window.__triggerLogoutModal && window.__triggerLogoutModal()"
            ></button>
        </main>
    </div>

</div>

<script type="text/babel" src="js/sidebar.jsx"></script>
<script type="text/babel" src="js/topbar.jsx"></script>
<script type="text/babel" src="js/dashboard.jsx"></script>
</body>
</html>
