<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/dashboard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        (function () {
            if (localStorage.getItem("sidebar-collapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed-init");
            }
            const theme = localStorage.getItem("dashboard-theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

<style>
    :root {
        --shell-edge: 18px;
        --shell-gap: 12px; /* small gap between sidebar and topbar */
        --sidebar-expanded-w: 250px;
        --sidebar-collapsed-w: 108px;
    }

    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        overflow-x: hidden;
    }

    .app-shell {
        min-height: 100vh;
        background: var(--bg-page, #f4f4f6);
    }

    .app-topbar {
        position: fixed;
        top: var(--shell-edge);
        left: calc(var(--shell-edge) + var(--sidebar-expanded-w) + var(--shell-gap));
        right: var(--shell-edge);
        z-index: 260;
        width: auto;
    }

    .app-body {
        position: relative;
        min-height: 100vh;
    }

    .app-sidebar-col {
        position: fixed;
        top: var(--shell-edge);
        left: var(--shell-edge);
        z-index: 300;
        padding: 0;
        flex-shrink: 0;
    }

    .app-main-col {
        min-width: 0;
        padding:
            calc(var(--shell-edge) + var(--topbar-height, 78px) + 18px)
            var(--shell-edge)
            24px
            calc(var(--shell-edge) + var(--sidebar-expanded-w) + var(--shell-gap));
    }

    body:has(.dashboard-sidebar.collapsed) .app-topbar {
        left: calc(var(--shell-edge) + var(--sidebar-collapsed-w) + var(--shell-gap));
    }

    body:has(.dashboard-sidebar.collapsed) .app-main-col {
        padding-left: calc(var(--shell-edge) + var(--sidebar-collapsed-w) + var(--shell-gap));
    }

    .topbar-profile-name,
    .topbar-profile-chevron,
    .topbar-dropdown-toggle i.bi-chevron-down,
    [class*="topbar"][class*="caret"],
    [class*="topbar"][class*="arrow"] {
        display: none !important;
    }

    @media (max-width: 767.98px) {
        .app-topbar {
            position: sticky;
            top: 0;
            left: auto;
            right: auto;
            width: 100%;
            z-index: 100;
        }

        .app-sidebar-col {
            position: static;
            top: auto;
            left: auto;
            z-index: auto;
        }

        .app-main-col {
            padding: calc(var(--topbar-height, 78px) + 16px) 16px 16px;
        }
    }
</style>
</head>

<body>
<div class="app-shell">

    <header class="app-topbar">
        <div id="topbar-root"></div>
    </header>

    <div class="app-body">
        <aside class="app-sidebar-col">
            <div id="sidebar-root" data-page="dashboard"></div>
        </aside>

        <main class="app-main-col">
            <div id="react-modal-root"></div>
            <div id="root"></div>

            <button
                id="openReactModalBtn"
                style="display:none;"
                onclick="window.__triggerLogoutModal && window.__triggerLogoutModal()"
            ></button>
        </main>
    </div>

</div>

<script type="text/babel" src="js/sidebar.jsx"></script>
<script type="text/babel" src="js/topbar.jsx"></script>
<script type="text/babel" src="js/dashboard.jsx"></script>
</body>
</html>
