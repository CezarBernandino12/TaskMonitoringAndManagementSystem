<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../imgs/psi.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/profile.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
    body {
        background-color: #fffaf3;
        color: #333; /* slightly darker for better contrast */
        font-family: Arial, sans-serif;
    }

    .card {
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid #ffb84d; /* slightly darker border */
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); /* subtle shadow for readability */
        color: #222; /* dark text for contrast */
    }

    .overdue {
        background-color: #fff0b3 !important; /* darker yellow for readability */
        color: #665200; /* darker text on yellow */
    }

    .btn-primary {
        background-color: #ff9900;
        border-color: #ff9900;
        color: #fff;
    }

    .btn-primary:hover, .btn-primary:focus {
        background-color: #ffb84d;
        border-color: #ffb84d;
        color: #333; /* darker text for readability */
    }

    .table thead {
        background: #ffe7b3; /* darker yellow header */
    }

    .table th {
        color: #cc7a00; /* darker orange text for readability */
    }

    .table-hover tbody tr:hover {
        background: #fff0b3;
    }

    .form-control:focus {
        border-color: #ffb84d;
        box-shadow: 0 0 0 0.2rem rgba(255, 184, 77, 0.2);
    }

    h3, h5, h6 {
        color: #cc7a00; /* darker headings */
    }

    .summary-card {
        background: linear-gradient(135deg, #ffe7b3 0%, #ffd27f 100%);
        border: 1px solid #ffb84d;
        color: #cc7a00;
    }
    </style>
</head>
<body>


<div class="container-fluid py-4">
    <div class="row">
        <aside class="col-12 col-md-4 col-lg-3 col-xl-2">
            <nav class="dashboard-sidebar">
                <div class="sidebar-profile">
                    <img
                        src="https://ui-avatars.com/api/?name=Andrew+Smith&background=f7c4d4&color=222&size=80"
                        alt="Profile"
                        class="sidebar-avatar"
                    >
                    <div>
                        <div class="sidebar-role">Staff</div>
                        <div class="sidebar-name">Andrew Smith</div>
                    </div>
                </div>

                <div class="sidebar-divider"></div>

                <div class="sidebar-section-label">MAIN</div>

                <a href="dashboard.html" class="sidebar-link">
                    <span class="sidebar-icon"><i class="bi bi-house-door"></i></span>
                    <span>Dashboard</span>
                </a>

                <a href="my-tasks.html" class="sidebar-link">
                    <span class="sidebar-icon"><i class="bi bi-list-check"></i></span>
                    <span>My Tasks</span>
                </a>

                <a href="calendar.html" class="sidebar-link">
                    <span class="sidebar-icon"><i class="bi bi-calendar3"></i></span>
                    <span>Calendar</span>
                </a>

                <div class="sidebar-divider mt-3"></div>

                <div class="sidebar-section-label">SETTINGS</div>

                <a href="profile.html" class="sidebar-link active">
                    <span class="sidebar-icon"><i class="bi bi-gear"></i></span>
                    <span>Account Settings</span>
                </a>

                <div class="sidebar-bottom">

                    <a href="#" class="sidebar-link logout-link">
                        <span class="sidebar-icon"><i class="bi bi-box-arrow-right"></i></span>
                        <span>Logout Account</span>
                    </a>
                </div>
            </nav>
        </aside>
    
    <main class="col-md-10 ms-sm-auto px-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Profile</h3>
    </div>

    <!-- React Modal Root -->
    <div id="react-modal-root"></div>

    
   

    

    <div id="root"></div>


</div>
<script type="text/babel">


function Profile() {
    const [profile, setProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [error, setError] = React.useState(null);

    React.useEffect(() => {
        fetch('php/get_profile.php')
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    setError(data.error);
                } else {
                    setProfile(data);
                }
                setLoading(false);
            })
            .catch(() => {
                setError('Failed to load profile');
                setLoading(false);
            });
    }, []);

    return (
        <div className="card p-4 mb-4" style={{ maxWidth: 500 }}>
            <h5 className="mb-3">My Profile</h5>
            {loading ? (
                <div className="text-warning">Loading...</div>
            ) : error ? (
                <div className="text-danger">{error}</div>
            ) : profile ? (
                <>
                    <div className="mb-2"><strong>Name:</strong> {profile.name}</div>
                    <div className="mb-2"><strong>Email:</strong> {profile.email}</div>
                    <div className="mb-2"><strong>Contact:</strong> {profile.contact}</div>
                    <div className="mb-2"><strong>Address:</strong> {profile.address}</div>
                    <div className="mb-2"><strong>Department ID:</strong> {profile.department_id}</div>
                    <div className="mb-2"><strong>Role:</strong> {profile.role}</div>
                </>
            ) : null}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Profile />);
</script>

</body>
</html>
