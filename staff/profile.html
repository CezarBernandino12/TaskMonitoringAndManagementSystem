<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
    body {
        background-color: #fffaf3;
        color: #333; /* slightly darker for better contrast */
        font-family: Arial, sans-serif;
    }

    .card {
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid #ffb84d; /* slightly darker border */
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); /* subtle shadow for readability */
        color: #222; /* dark text for contrast */
    }

    .overdue {
        background-color: #fff0b3 !important; /* darker yellow for readability */
        color: #665200; /* darker text on yellow */
    }

    .sidebar-orange {
        background: #fff;
        color: #ff9900;
        border-right: 1px solid #ffe0b2;
        box-shadow: 2px 0 8px rgba(255, 153, 0, 0.04);
    }

    .sidebar-orange .nav-link {
        color: #cc7a00 !important;
        border-radius: 8px;
        margin-bottom: 2px;
        transition: background 0.2s, color 0.2s;
        font-weight: 500;
        padding: 10px 18px;
        font-size: 1.08rem;
        letter-spacing: 0.01em;
    }

    .sidebar-orange .nav-link.active, 
    .sidebar-orange .nav-link:hover {
        background: linear-gradient(90deg, #ff9900 60%, #ff8800 100%);
        color: #fff !important;
        box-shadow: 0 2px 8px rgba(255, 153, 0, 0.10);
    }

    .sidebar-orange {
        background: linear-gradient(180deg, #ff9900 0%, #ff8800 100%);
        color: #fff;
    }

    .sidebar-orange .nav-link {
        color: #fff !important;
        border-radius: 8px;
        margin-bottom: 2px;
        transition: background 0.2s;
    }

    .sidebar-orange .nav-link.active, 
    .sidebar-orange .nav-link:hover {
        background: #ffe7b3; /* darker hover background */
        color: #ff8000 !important; /* darker orange for contrast */
    }

    .btn-primary {
        background-color: #ff9900;
        border-color: #ff9900;
        color: #fff;
    }

    .btn-primary:hover, .btn-primary:focus {
        background-color: #ffb84d;
        border-color: #ffb84d;
        color: #333; /* darker text for readability */
    }

    .table thead {
        background: #ffe7b3; /* darker yellow header */
    }

    .table th {
        color: #cc7a00; /* darker orange text for readability */
    }

    .table-hover tbody tr:hover {
        background: #fff0b3;
    }

    .form-control:focus {
        border-color: #ffb84d;
        box-shadow: 0 0 0 0.2rem rgba(255, 184, 77, 0.2);
    }

    h3, h5, h6 {
        color: #cc7a00; /* darker headings */
    }

    .summary-card {
        background: linear-gradient(135deg, #ffe7b3 0%, #ffd27f 100%);
        border: 1px solid #ffb84d;
        color: #cc7a00;
    }
    </style>
</head>
<body>


<div class="container-fluid py-4">
    <div class="row">
        <!-- SIDEBAR -->
        <nav class="col-md-2 d-none d-md-block bg-white border-end min-vh-100 p-0">
            <div class="sidebar-orange d-flex flex-column align-items-start p-3 gap-2 min-vh-100">
                <a href="dashboard.html" class="nav-link fw-semibold">Dashboard</a>
                <a href="my-tasks.html" class="nav-link fw-semibold">My Tasks</a>
                <a href="calendar.html" class="nav-link fw-semibold">Calendar</a>
                <a href="profile.html" class="nav-link fw-semibold active">Profile</a>
            </div>
        </nav>
        <!-- MAIN CONTENT -->
        <main class="col-md-10 ms-sm-auto px-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Profile</h3>
    </div>

    <!-- React Modal Root -->
    <div id="react-modal-root"></div>

    
   

    

    <div id="root"></div>


</div>
<script type="text/babel">


function Profile() {
    const [profile, setProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [error, setError] = React.useState(null);

    React.useEffect(() => {
        fetch('php/get_profile.php')
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    setError(data.error);
                } else {
                    setProfile(data);
                }
                setLoading(false);
            })
            .catch(() => {
                setError('Failed to load profile');
                setLoading(false);
            });
    }, []);

    return (
        <div className="card p-4 mb-4" style={{ maxWidth: 500 }}>
            <h5 className="mb-3">My Profile</h5>
            {loading ? (
                <div className="text-warning">Loading...</div>
            ) : error ? (
                <div className="text-danger">{error}</div>
            ) : profile ? (
                <>
                    <div className="mb-2"><strong>Name:</strong> {profile.name}</div>
                    <div className="mb-2"><strong>Email:</strong> {profile.email}</div>
                    <div className="mb-2"><strong>Contact:</strong> {profile.contact}</div>
                    <div className="mb-2"><strong>Address:</strong> {profile.address}</div>
                    <div className="mb-2"><strong>Department ID:</strong> {profile.department_id}</div>
                    <div className="mb-2"><strong>Role:</strong> {profile.role}</div>
                </>
            ) : null}
        </div>
    );
}




ReactDOM.createRoot(document.getElementById('root')).render(<Profile />);
</script>

</body>
</html>
