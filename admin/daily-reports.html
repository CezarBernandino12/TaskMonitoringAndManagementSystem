<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Daily Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../imgs/psi.png" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/topbar.css" />
    <link rel="stylesheet" href="css/top-shell.css" />
    <link rel="stylesheet" href="css/daily.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin ></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin ></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ECharts: required by the updated daily_fixed_consistent_ui.js -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>

    <!-- Optional: keep Chart.js only if other shared scripts still need it -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- Theme / Sidebar Initial State -->
    <script>
        (function () {
            const root = document.documentElement;

            if (localStorage.getItem("sidebar-collapsed") === "true") {
                root.classList.add("sidebar-collapsed-init");
            }

            const theme = localStorage.getItem("dashboard-theme") || "light";
            root.setAttribute("data-theme", theme);
            root.setAttribute("data-bs-theme", theme);

            const syncBootstrapTheme = () => {
                root.setAttribute(
                    "data-bs-theme",
                    root.getAttribute("data-theme") || "light"
                );
            };

            new MutationObserver(syncBootstrapTheme).observe(root, {
                attributes: true,
                attributeFilter: ["data-theme"]
            });
        })();
    </script>
</head>

<body class="bg-body">
    <div id="sileo-root"></div>

    <div class="app-shell">
        <header class="app-topbar">
            <div id="topbar-root"></div>
        </header>

        <div class="app-body">
            <aside class="app-sidebar-col">
                <div id="sidebar-root"></div>
            </aside>

            <main class="app-main-col">
                <div id="react-modal-root"></div>

                <!-- Daily Report React Mount -->
                <div id="root"></div>
            </main>
        </div>
    </div>

    <!-- Sidebar -->
    <script type="text/babel" src="js/sidebar.jsx"></script>

    <!-- Topbar -->
    <script
        type="text/babel"
        data-type="module"
        data-presets="react"
        src="js/topbar.jsx"
    ></script>

    <!-- Updated Daily Report JS -->
    <script
        type="text/babel"
        data-presets="react"
        src="js/daily.jsx"
    ></script>
</body>
</html>
