<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Department Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #fffaf3; color: #333; font-family: Arial, sans-serif; }

    .card {
      border-radius: 12px; background: #fff;
      border: 1px solid #ffb84d; box-shadow: 0 2px 8px rgba(0,0,0,0.08); color: #222;
    }

    /* Sidebar */
    .sidebar-orange { background: #fff; border-right: 1px solid #ffe0b2; box-shadow: 2px 0 8px rgba(255,153,0,0.04); }
    .sidebar-orange .nav-link { color: #cc7a00 !important; border-radius: 8px; margin-bottom: 2px; transition: 0.2s; font-weight: 500; padding: 10px 18px; font-size: 14px; }
    .sidebar-orange .nav-link:hover { background: linear-gradient(90deg,#ff9900 60%,#ff8800 100%); color: #fff !important; }
    .sidebar-orange .nav-link.active { background: linear-gradient(90deg,#ff9900 60%,#ff8800 100%); color: #fff !important; }
    .sidebar-section { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #bbb; text-transform: uppercase; padding: 8px 18px 4px; margin-top: 4px; }
    .sidebar-logo { font-size: 18px; font-weight: 700; color: #cc7a00; padding: 16px 18px 12px; border-bottom: 1px solid #ffe0b2; margin-bottom: 8px; letter-spacing: -.3px; }

    /* Stat cards */
    .stat-card { border-left: 4px solid #ffb84d; }
    .stat-card.blue   { border-left-color: #0d6efd; }
    .stat-card.green  { border-left-color: #28a745; }
    .stat-card.orange { border-left-color: #ff9900; }
    .stat-card.red    { border-left-color: #dc3545; }
    .stat-card.purple { border-left-color: #6f42c1; }
    .stat-card.teal   { border-left-color: #0dcaf0; }

    /* Role badge */
    .role-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
    .role-admin      { background: #fff3cd; color: #856404; }
    .role-supervisor { background: #cfe2ff; color: #084298; }
    .role-staff      { background: #d1e7dd; color: #0a3622; }
    .role-president  { background: #f8d7da; color: #842029; }

    /* Active badge */
    .active-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .dot-active   { background: #28a745; }
    .dot-inactive { background: #dc3545; }

    /* Ring */
    .ring-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto; }
    .ring-wrap canvas { position: absolute; inset: 0; }
    .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }

    /* No-tasks alert row */
    .alert-row { background: #fff8f0; border-left: 3px solid #ff9900; border-radius: 6px; padding: 8px 12px; font-size: 13px; }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <div id="sidebarRoot" class="col-md-2 p-0"></div>
    <div id="departmentManagementRoot" class="col-md-10"></div>
  </div>
</div>


<script type="text/babel">

function Sidebar() {
  const [showUsers,   setShowUsers]   = React.useState(false);
  const [showReports, setShowReports] = React.useState(false);

  const NavGroup = ({ label, open, onToggle, children }) => (
    <>
      <a href="#" className="nav-link fw-semibold d-flex justify-content-between align-items-center"
         onClick={e => { e.preventDefault(); onToggle(); }} style={{ cursor: 'pointer' }}>
        <span>{label}</span>
        <span style={{ fontSize: '1em' }}>{open ? '▼' : '▶'}</span>
      </a>
      {open && <div style={{ marginLeft: 12 }}>{children}</div>}
    </>
  );

  return (
    <nav className="sidebar-orange d-flex flex-column min-vh-100">
      <div className="sidebar-logo">⚙ Admin Panel</div>

      {/* Overview */}
      <div className="sidebar-section">Overview</div>
      <a href="admin-dashboard.html" className="nav-link active">Dashboard</a>

      {/* User Management */}
      <div className="sidebar-section">User Management</div>
      <a href="users.html"  className="nav-link">Manage Users</a>
      <a href="departments.html"  className="nav-link">Departments</a>

      {/* Task Management */}
      <div className="sidebar-section">Task Management</div>
      <a href="all-tasks.html"    className="nav-link">All Tasks</a>
      <a href="assign-task.html"  className="nav-link">Assign Task</a>

      {/* Reports */}
      <div className="sidebar-section">Reports</div>
      <NavGroup label="Reports" open={showReports} onToggle={() => setShowReports(p => !p)}>
        <a href="daily-reports.html"     className="nav-link">Daily</a>
        <a href="weekly-reports.html"    className="nav-link">Weekly</a>
        <a href="monthly-reports.html"   className="nav-link">Monthly</a>
        <a href="quarterly-reports.html" className="nav-link">Quarterly</a>
        <a href="annual-reports.html"    className="nav-link">Annually</a>
      </NavGroup>

      {/* Account */}
      <div className="sidebar-section">Account</div>
      <a href="profile.html"  className="nav-link">Profile</a>
      <a href="logout.php"    className="nav-link text-danger">Log Out</a>
    </nav>
  );
}

    // Department Management Component
    function DepartmentManagement() {
      const [departments, setDepartments] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      const [showAdd, setShowAdd] = React.useState(false);
      const [newDept, setNewDept] = React.useState("");
      const [editId, setEditId] = React.useState(null);
      const [editName, setEditName] = React.useState("");

      React.useEffect(() => {
        fetchDepartments();
      }, []);

      function fetchDepartments() {
        setLoading(true);
        fetch("php/departments.php")
          .then(res => res.json())
          .then(data => {
            setDepartments(data.departments || []);
            setLoading(false);
          })
          .catch(e => {
            setError("Failed to load departments");
            setLoading(false);
          });
      }

      function handleAddDepartment(e) {
        e.preventDefault();
        if (!newDept.trim()) return;
        fetch("php/save_department.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: newDept })
        })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              setNewDept("");
              setShowAdd(false);
              fetchDepartments();
            } else {
              setError(data.message || "Failed to add department");
            }
          });
      }

      function handleEditDepartment(id, name) {
        setEditId(id);
        setEditName(name);
      }

      function handleUpdateDepartment(e) {
        e.preventDefault();
        fetch("php/save_department.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: editId, name: editName })
        })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              setEditId(null);
              setEditName("");
              fetchDepartments();
            } else {
              setError(data.message || "Failed to update department");
            }
          });
      }

      function handleDeleteDepartment(id) {
        if (!window.confirm("Delete this department?")) return;
        fetch("php/delete_department.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              fetchDepartments();
            } else {
              setError(data.message || "Failed to delete department");
            }
          });
      }

      return (
        <div className="container py-4">
          <h2 className="mb-4">Department Management</h2>
          {error && <div className="alert alert-danger">{error}</div>}
          <div className="mb-3 d-flex justify-content-between align-items-center">
            <span className="fw-bold">Departments</span>
            <button className="btn btn-sm btn-primary" onClick={() => setShowAdd(true)}>Add Department</button>
          </div>
          {loading ? (
            <div>Loading...</div>
          ) : departments.length === 0 ? (
            <div className="alert-row">No departments found.</div>
          ) : (
            <div className="table-responsive">
              <table className="table table-bordered align-middle">
                <thead className="table-light">
                  <tr>
                    <th style={{width: '60px'}}>#</th>
                    <th>Name</th>
                    <th style={{width: '160px'}}>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {departments.map((dept, idx) => (
                    <tr key={dept.id}>
                      <td>{idx + 1}</td>
                      <td>
                        {editId === dept.id ? (
                          <form className="d-flex" onSubmit={handleUpdateDepartment}>
                            <input className="form-control form-control-sm me-2" value={editName} onChange={e => setEditName(e.target.value)} required />
                            <button className="btn btn-success btn-sm me-1" type="submit">Save</button>
                            <button className="btn btn-secondary btn-sm" type="button" onClick={() => setEditId(null)}>Cancel</button>
                          </form>
                        ) : (
                          dept.name
                        )}
                      </td>
                      <td>
                        <button className="btn btn-warning btn-sm me-2" onClick={() => handleEditDepartment(dept.id, dept.name)}>Edit</button>
                        <button className="btn btn-danger btn-sm" onClick={() => handleDeleteDepartment(dept.id)}>Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Add Department Modal */}
          {showAdd && (
            <div className="modal show d-block" tabIndex="-1" style={{background: 'rgba(0,0,0,0.15)'}}>
              <div className="modal-dialog">
                <div className="modal-content">
                  <form onSubmit={handleAddDepartment}>
                    <div className="modal-header">
                      <h5 className="modal-title">Add Department</h5>
                      <button type="button" className="btn-close" onClick={() => setShowAdd(false)}></button>
                    </div>
                    <div className="modal-body">
                      <input className="form-control" placeholder="Department Name" value={newDept} onChange={e => setNewDept(e.target.value)} required />
                    </div>
                    <div className="modal-footer">
                      <button type="button" className="btn btn-secondary" onClick={() => setShowAdd(false)}>Cancel</button>
                      <button type="submit" className="btn btn-primary">Add</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("sidebarRoot")).render(<Sidebar />);
    ReactDOM.createRoot(document.getElementById("departmentManagementRoot")).render(<DepartmentManagement />);
    
</script>

</body>
</html>
