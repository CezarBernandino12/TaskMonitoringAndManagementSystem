<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Department Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fffaf3;
      color: #333;
      font-family: Arial, sans-serif;
    }

    .card {
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #ffb84d;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      color: #222;
    }

    .sidebar-orange {
      background: #fff;
      color: #ff9900;
      border-right: 1px solid #ffe0b2;
      box-shadow: 2px 0 8px rgba(255, 153, 0, 0.04);
    }

    .sidebar-orange .nav-link {
      color: #cc7a00 !important;
      border-radius: 8px;
      margin-bottom: 2px;
      transition: 0.2s;
      font-weight: 500;
      padding: 10px 18px;
    }

    .sidebar-orange .nav-link.active,
    .sidebar-orange .nav-link:hover {
      background: linear-gradient(90deg, #ff9900 60%, #ff8800 100%);
      color: #fff !important;
    }

    .summary-card {
      background: linear-gradient(135deg, #ffe7b3 0%, #ffd27f 100%);
      border: 1px solid #ffb84d;
      color: #cc7a00;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;


// Chart.js CDN
const chartJsScript = document.createElement('script');
chartJsScript.src = 'https://cdn.jsdelivr.net/npm/chart.js';
document.head.appendChild(chartJsScript);

function useDepartmentPerformance() {
  const [data, setData] = useState([]);
  useEffect(() => {
    fetch('php/get_department_performance.php')
      .then(res => res.json())
      .then(setData)
      .catch(() => setData([]));
  }, []);
  return data;
}

function DepartmentBarChart({ data }) {
  const chartRef = React.useRef(null);
  useEffect(() => {
    if (!window.Chart || !data || !data.length || !chartRef.current) return;
    const ctx = chartRef.current.getContext('2d');
    if (window.deptBarChartInstance) {
      window.deptBarChartInstance.destroy();
    }
    // Always set a fixed height for the chart
    chartRef.current.height = 300;
    chartRef.current.width = chartRef.current.parentElement.offsetWidth;

    window.deptBarChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.map(d => d.department),
        datasets: [
          {
            label: 'Total Tasks',
            data: data.map(d => d.total_tasks),
            backgroundColor: '#ffd27f',
            borderColor: '#ffb84d',
            borderWidth: 1
          },
          {
            label: 'Completed',
            data: data.map(d => d.completed),
            backgroundColor: '#b6e388',
            borderColor: '#7ed957',
            borderWidth: 1
          },
          {
            label: 'Ongoing',
            data: data.map(d => d.ongoing),
            backgroundColor: '#ffe066',
            borderColor: '#ffd700',
            borderWidth: 1
          },
          {
            label: 'Overdue',
            data: data.map(d => d.overdue),
            backgroundColor: '#ffb3b3',
            borderColor: '#ff4d4d',
            borderWidth: 1
          }
        ]
      },
      options: {
        responsive: false, // Disable responsive to keep height fixed
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top' },
          title: { display: false }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }, [data]);
  return (
    <div className="card p-3 mb-4" style={{ height: 350 }}>
      <h5>Department Performance</h5>
      <div style={{ height: 300 }}>
        <canvas ref={chartRef} height="300"></canvas>
      </div>
    </div>
  );
}

function Dashboard() {
  const [stats, setStats] = useState({
    total_departments: '-',
    total_tasks: '-',
    completed_tasks: '-',
    completion_rate: '-'
  });

  useEffect(() => {
    fetch('php/get_dashboard_stats.php')
      .then(res => res.json())
      .then(data => setStats(data))
      .catch(() => {});
  }, []);

  // Fetch department performance for overdue tasks
  const [departments, setDepartments] = useState([]);
  const [selectedDept, setSelectedDept] = useState(null);
  useEffect(() => {
    fetch('php/get_department_performance.php')
      .then(res => res.json())
      .then(data => Array.isArray(data) ? setDepartments(data) : setDepartments([]))
      .catch(() => setDepartments([]));
  }, []);

  // Filtered departments for display (all or selected)
  const displayDepartments = selectedDept
    ? departments.filter(d => d.department === selectedDept)
    : departments;

  // Find the max overdue count (from filtered list)
  const filtered = displayDepartments.filter(d => Number(d.overdue) > 0);
  let topOverdue = [];
  if (filtered.length > 0) {
    const maxOverdue = Math.max(...filtered.map(d => Number(d.overdue)));
    topOverdue = filtered.filter(d => Number(d.overdue) === maxOverdue);
  }

  return (
    <div className="container-fluid py-4">
      <div className="row">
        {/* SIDEBAR */}
   <nav className="col-md-2 d-none d-md-block bg-white border-end min-vh-100 p-0">
  <div className="sidebar-orange d-flex flex-column p-3 gap-2 min-vh-100">
    {/* Dashboard link */}
    <a href="dashboard.html" className="nav-link fw-semibold">Dashboard</a>

    {/* Reports collapsible menu */}
    {(() => {
      const [showReports, setShowReports] = React.useState(false);
      // Use a ref to force re-render on toggle
      const forceUpdate = React.useReducer(x => x + 1, 0)[1];
      // Attach to window to persist state across renders
      if (window._showReports === undefined) window._showReports = false;
      const toggleReports = e => {
        e.preventDefault();
        window._showReports = !window._showReports;
        forceUpdate();
      };
      return (
        <>
          <a href="#" className="nav-link fw-semibold d-flex justify-content-between align-items-center" onClick={toggleReports} style={{cursor:'pointer'}}>
            <span>Reports</span>
            <span style={{fontSize: '1.1em'}}>{window._showReports ? '\u25BC' : '\u25B6'}</span>
          </a>
          {window._showReports && (
            <div style={{marginLeft: 12}}>
              <a href="daily-reports.html" className="nav-link fw-semibold">Daily</a>
              <a href="weekly-reports.html" className="nav-link fw-semibold">Weekly</a>
              <a href="monthly-reports.html" className="nav-link fw-semibold">Monthly</a>
              <a href="quarterly-reports.html" className="nav-link fw-semibold">Quarterly</a>
              <a href="annual-reports.html" className="nav-link fw-semibold">Annually</a>
            </div>
          )}
        </>
      );
    })()}

    {/* Profile link */}
    <a href="profile.html" className="nav-link fw-semibold">Profile</a>
  </div>
</nav>
        {/* MAIN */}
        <main className="col-md-10 ms-sm-auto px-4">
          {/* HEADER */}
          <div className="mb-4">
            <h3>Department Reports</h3>
            <p className="text-muted">Department Performance Overview</p>
          </div>
          {/* SUMMARY: Show department names from DB as filter buttons */}
          <div className="row mb-4">
            {departments.length === 0 ? (
              <div className="col-12">
                <div className="card summary-card text-center p-3">
                  <h6>No departments found</h6>
                </div>
              </div>
            ) : (
              departments.slice(0, 6).map((dept, idx) => (
                <div className="col-md-2" key={dept.department + idx}>
                  <div
                    className={`card summary-card text-center p-3 ${selectedDept === dept.department ? 'border-3 border-warning' : ''}`}
                    style={{ cursor: 'pointer', boxShadow: selectedDept === dept.department ? '0 0 0 2px #ff9900' : undefined }}
                    onClick={() => setSelectedDept(selectedDept === dept.department ? null : dept.department)}
                  >
                    <h6>{dept.department}</h6>
                  </div>
                </div>
              ))
            )}
     
          </div>

          {/* BAR CHART */}
          <DepartmentBarChart data={displayDepartments} />
   
          {/* TABLE VERSION OF PERFORMANCE */}
          <div className="card p-3">
            <h5>Department Performance Table</h5>
            <div className="table-responsive">
              <table className="table table-bordered table-hover align-middle">
                <thead className="table-light">
                  <tr>
                    <th>Department</th>
                    <th>Total Tasks</th>
                    <th>Completed</th>
                    <th>Ongoing</th>
                    <th>Overdue</th>
                    <th>Completion %</th>
                  </tr>
                </thead>
                <tbody>
                  {displayDepartments.length === 0 ? (
                    <tr><td colSpan="6" className="text-center">No data available</td></tr>
                  ) : (
                    displayDepartments.map((dept, idx) => (
                      <tr key={dept.department + idx}>
                        <td>{dept.department}</td>
                        <td>{dept.total_tasks}</td>
                        <td>{dept.completed}</td>
                        <td>{dept.ongoing}</td>
                        <td>{dept.overdue}</td>
                                     <td>
                          <div className="d-flex align-items-center gap-2">
                            <span style={{minWidth: 32}}>{dept.completion_percent}%</span>
                            <div className="progress flex-grow-1" style={{height: '18px', minWidth: 80}}>
                              <div
                                className="progress-bar bg-success"
                                role="progressbar"
                                style={{width: `${dept.completion_percent}%`}}
                                aria-valuenow={dept.completion_percent}
                                aria-valuemin="0"
                                aria-valuemax="100"
                              >
                              </div>
                            </div>
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>



                
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

chartJsScript.onload = () => {
  ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
};
</script>

</body>
</html>
